<title>Command Center Personal</title>
<h1>Command Center Personal</h1>
<p>This is a private app used only by its owner on their own computer. It reads the owner's own email and files in the owner's own Google account to show their own budget. It does not collect, share or sell anyone's data, and it sends nothing to anyone else.</p>
